services:
  - type: web
    name: index-ict-amd
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: INDEX
        value: NQ
      - key: FRED_KEY
        sync: false
